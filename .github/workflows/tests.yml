# Corre el análisis y los tests en cada PR y en cada push a main. Linux alcanza: los tests no dependen de Windows
# (lo específico de Windows —instalador, ventana— no se prueba acá). NO publica nada.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      # Todo el repo (app, tests y herramientas) tiene que dar "No issues found!" (limpiado el 2026-10-03): un aviso nuevo
      # frena el PR en vez de acumularse.
      - name: Análisis (sin avisos)
        run: flutter analyze
      - name: Tests
        run: flutter test
